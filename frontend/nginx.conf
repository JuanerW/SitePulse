server {
    listen 80;
    server_name _;

    # The edge proxy (OpenResty on the host) connects from a private address
    # and sends the visitor's address in X-Real-IP. Trust it only from there,
    # so $remote_addr below is the real visitor and the API's per-IP rate
    # limit is actually per visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
