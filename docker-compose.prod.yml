# Production compose for the Oracle host (sitepulse.hanyuuu.com).
# PostgreSQL and Redis are the 1Panel-managed containers on `1panel-network`
# (REDIS_URL in .env points at Redis database 1, with its password); only the
# frontend (nginx, proxies /api → api) is published, on loopback, for
# OpenResty to reverse-proxy. The local docker-compose.yml still runs its own
# Redis so the project starts with one command anywhere.
#
# Secrets live in a gitignored .env next to this file (see backend/.env.example
# for the expected keys) — nothing in this compose file is a credential.
#
#   sudo docker compose -f docker-compose.prod.yml up -d --build

services:
  migrate:
    build: ./backend
    image: sitepulse-backend:latest
    container_name: sitepulse-migrate
    command: python -m alembic upgrade head
    env_file: .env
    networks: [default, 1panel-network]
    restart: "no"

  api:
    image: sitepulse-backend:latest
    container_name: sitepulse-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Shown in the page header; deploy_sitepulse.sh exports the short SHA.
      GIT_SHA: ${GIT_SHA:-unknown}
    networks: [default, 1panel-network]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: sitepulse-backend:latest
    container_name: sitepulse-worker
    command: celery -A celery_app worker -B --schedule /tmp/celerybeat-schedule --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file: .env
    networks: [default, 1panel-network]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    image: sitepulse-frontend:latest
    container_name: sitepulse-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  1panel-network:
    external: true
